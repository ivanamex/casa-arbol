<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Compare — Casa Árbol current vs redesign</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#111;background:#e5e5e5;display:flex;flex-direction:column;overflow:hidden}
  .bar{flex:0 0 auto;display:flex;align-items:center;gap:16px;padding:8px 12px;background:#fff;border-bottom:1px solid #ccc}
  .bar strong{font-weight:600}
  .bar label{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
  .bar .group{display:inline-flex;gap:12px;padding-left:16px;border-left:1px solid #ccc}
  .bar .spacer{flex:1}
  .bar .hint{color:#666;font-size:12px}
  .panes{flex:1 1 auto;display:flex;min-height:0}
  .pane{flex:1 1 0;min-width:0;display:flex;flex-direction:column;border-right:1px solid #ccc}
  .pane:last-child{border-right:0}
  .pane h2{flex:0 0 auto;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:6px 10px;background:#f4f4f4;border-bottom:1px solid #ccc;color:#333}
  .pane h2 span{font-weight:400;color:#777;text-transform:none;letter-spacing:0;margin-left:6px}
  .stage{flex:1 1 auto;position:relative;overflow:hidden;background:#d8d8d8}
  .stage iframe{position:absolute;top:0;left:0;border:0;background:#fff;transform-origin:0 0}
  .stage.mobile iframe{left:50%;transform:translateX(-50%)}
  @media (max-width:820px){
    .panes{flex-direction:column}
    .pane{border-right:0;border-bottom:1px solid #ccc}
    .pane:last-child{border-bottom:0}
  }
</style>
</head>
<body>
<div class="bar">
  <strong>Compare</strong>
  <div class="group" role="radiogroup" aria-label="Frame width">
    <label><input type="radio" name="width" value="desktop" checked> Desktop <span class="hint">(1440 px, scaled to fit)</span></label>
    <label><input type="radio" name="width" value="mobile"> Mobile <span class="hint">(390 px)</span></label>
  </div>
  <div class="group">
    <label><input type="checkbox" id="sync"> Sync scroll</label>
  </div>
  <div class="spacer"></div>
  <span class="hint">branch: redesign-era</span>
</div>
<div class="panes">
  <div class="pane">
    <h2>Current <span>/old.html</span></h2>
    <div class="stage" id="stageA"><iframe id="frameA" src="/old.html" title="Current site"></iframe></div>
  </div>
  <div class="pane">
    <h2>Redesign <span>/</span></h2>
    <div class="stage" id="stageB"><iframe id="frameB" src="/" title="Redesign"></iframe></div>
  </div>
</div>
<script>
(function(){
  var DESKTOP=1440, MOBILE=390;
  var stages=[document.getElementById('stageA'),document.getElementById('stageB')];
  var frames=[document.getElementById('frameA'),document.getElementById('frameB')];
  var syncBox=document.getElementById('sync');
  var mode='desktop';

  function layout(){
    stages.forEach(function(stage,i){
      var f=frames[i], w=stage.clientWidth, h=stage.clientHeight;
      if(mode==='mobile'){
        stage.classList.add('mobile');
        f.style.width=MOBILE+'px';
        f.style.height=h+'px';
        f.style.transform='translateX(-50%)';
      }else{
        stage.classList.remove('mobile');
        var s=Math.min(1,w/DESKTOP);
        f.style.width=DESKTOP+'px';
        f.style.height=Math.ceil(h/s)+'px';
        f.style.transform='scale('+s+')';
      }
    });
  }

  document.querySelectorAll('input[name="width"]').forEach(function(r){
    r.addEventListener('change',function(){ if(r.checked){ mode=r.value; layout(); } });
  });
  window.addEventListener('resize',layout);
  layout();

  // Sync scroll: same percentage in both frames (same-origin, so contentWindow is accessible).
  var lock=false;
  function pct(win){
    var d=win.document.scrollingElement||win.document.documentElement;
    var max=d.scrollHeight-win.innerHeight;
    return max>0? win.scrollY/max : 0;
  }
  function setPct(win,p){
    var d=win.document.scrollingElement||win.document.documentElement;
    var max=d.scrollHeight-win.innerHeight;
    win.scrollTo({top:Math.round(p*max),left:0,behavior:'instant'});
  }
  function onScroll(src,dst){
    return function(){
      if(!syncBox.checked||lock) return;
      lock=true;
      try{ setPct(dst.contentWindow,pct(src.contentWindow)); }catch(e){}
      requestAnimationFrame(function(){ lock=false; });
    };
  }
  function bind(){
    try{
      frames[0].contentWindow.addEventListener('scroll',onScroll(frames[0],frames[1]),{passive:true});
      frames[1].contentWindow.addEventListener('scroll',onScroll(frames[1],frames[0]),{passive:true});
    }catch(e){}
  }
  frames.forEach(function(f){ f.addEventListener('load',bind); });
  syncBox.addEventListener('change',function(){
    if(syncBox.checked){ try{ setPct(frames[1].contentWindow,pct(frames[0].contentWindow)); }catch(e){} }
  });
})();
</script>
</body>
</html>
